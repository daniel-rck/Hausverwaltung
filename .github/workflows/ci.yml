name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Wiederverwendbarer Workflow der web-base-Foundation:
  # lint (oxlint + oxfmt) → typecheck (App + SW + Worker) → test (Vitest) → build (SPA + SW).
  # Bun kommt aus `packageManager` in package.json.
  # Worker-Deploy/Dry-Run übernimmt Cloudflare Workers Builds (Git-Integration).
  ci:
    uses: daniel-rck/web-base/.github/workflows/web-app-ci.yml@v0.6.0

  # Bricht den Build, wenn ein *owned* web-base-Baustein von der Basis
  # abgewichen ist, ein core-Baustein fehlt oder ein Altbestand übrig ist.
  # Scaffold-Nähte (theme.css-Akzent, DB-Schema, Routen, Worker-Handler)
  # bleiben unangetastet. Die CLI läuft in der Version aus `webBase.version`.
  web-base-check:
    uses: daniel-rck/web-base/.github/workflows/web-base-check.yml@v0.6.0
    with:
      strict: true
