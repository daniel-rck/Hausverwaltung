name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Wiederverwendbarer Workflow der web-base-Foundation:
  # lint (Biome) → typecheck (App + SW + Worker) → test (Vitest) → build (SPA + SW).
  # Worker-Deploy/Dry-Run übernimmt Cloudflare Workers Builds (Git-Integration).
  ci:
    uses: daniel-rck/web-base/.github/workflows/web-app-ci.yml@main
    with:
      bun-version: "1.3.11"
