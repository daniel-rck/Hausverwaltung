name = "hausverwaltung"
main = "worker/index.ts"
compatibility_date = "2026-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Navigationen ohne passende Datei bekommen index.html (SPA-Modus). Mit dem
# HashRouter landen Client-Routen ohnehin nie beim Server; der Modus schadet
# nicht und deckt sich mit web-base. Kein run_worker_first: worker/base.ts
# sieht so auch veraltete /assets/*-Pfade und antwortet mit 404.
not_found_handling = "single-page-application"

# Bindings hier in wrangler.toml deklariert (statt nur im Dashboard),
# damit Workers Builds (Git-Auto-Deploy) sie nicht beim Re-Deploy
# überschreibt. wrangler.toml ist Source of Truth, das Dashboard zeigt
# danach nur noch an, was hier steht.

[[r2_buckets]]
binding = "SYNC_BUCKET"
bucket_name = "hausverwaltung-sync"

[[kv_namespaces]]
binding = "PAIR_KV"
id = "4d106b6283244dff9571a4956c3d2449"
