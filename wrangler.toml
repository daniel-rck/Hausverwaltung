name = "hausverwaltung"
main = "worker/index.ts"
compatibility_date = "2026-04-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Bindings hier in wrangler.toml deklariert (statt nur im Dashboard),
# damit Workers Builds (Git-Auto-Deploy) sie nicht beim Re-Deploy
# überschreibt. wrangler.toml ist Source of Truth, das Dashboard zeigt
# danach nur noch an, was hier steht.

[[r2_buckets]]
binding = "SYNC_BUCKET"
bucket_name = "hausverwaltung-sync"

[[kv_namespaces]]
binding = "PAIR_KV"
# TODO: Namespace-ID des `hausverwaltung-pairing`-KV einfügen.
# Finden via:
#   wrangler kv namespace list
# oder im Dashboard unter Workers & Pages → KV → hausverwaltung-pairing.
id = "REPLACE_WITH_HAUSVERWALTUNG_PAIRING_KV_ID"
